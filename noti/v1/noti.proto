syntax = "proto3";

package noti.v1;

option go_package = "github.com/hungp29/x-proto/gen/go/noti/v1;notiv1";

// NotificationChannel identifies how the notification is delivered.
// New channels can be added without breaking existing clients.
enum NotificationChannel {
  NOTIFICATION_CHANNEL_UNSPECIFIED = 0;
  NOTIFICATION_CHANNEL_EMAIL = 1;
  NOTIFICATION_CHANNEL_TELEGRAM = 2;
}

// EmailNotification is sent via SMTP or SendGrid depending on service configuration.
message EmailNotification {
  repeated string to = 1;
  string subject = 2;
  string body_text = 3;
  string body_html = 4;
  string reply_to = 5;
  string from_override = 6; // optional; otherwise server default from address is used
}

// TelegramNotification is sent with the Telegram Bot API.
message TelegramNotification {
  string chat_id = 1;
  string text = 2;
  string parse_mode = 3; // optional: "MarkdownV2", "HTML", or empty for plain text
  bool disable_web_page_preview = 4;
}

message SendNotificationRequest {
  NotificationChannel channel = 1;
  oneof payload {
    EmailNotification email = 2;
    TelegramNotification telegram = 3;
  }
  // Optional key/value pairs for tracing or future routing (e.g. tenant_id).
  map<string, string> metadata = 4;
}

message SendNotificationResponse {
  // Opaque id assigned when the job is enqueued (Redis stream message id or internal uuid).
  string notification_id = 1;
}

// NotificationService accepts outbound notifications and enqueues them for asynchronous delivery.
service NotificationService {
  rpc SendNotification(SendNotificationRequest) returns (SendNotificationResponse);
}
