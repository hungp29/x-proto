version: v1
managed:
  enabled: true
  go_package_prefix:
    default: github.com/hungp29/x-proto/gen/go
plugins:
  - plugin: buf.build/protocolbuffers/go
    out: gen/go
    opt: paths=source_relative
  - plugin: buf.build/grpc/go
    out: gen/go
    opt: paths=source_relative
  # Pin versions so generated Python matches protobuf 6.x (grpcio-reflection requires protobuf<7).
  - plugin: buf.build/protocolbuffers/python:v26.1
    out: gen/python
  - plugin: buf.build/grpc/python:v1.66.2
    out: gen/python
