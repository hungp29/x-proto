}

message UpdateIconRequest {
  string icon_id  = 1;
  string category = 2;
  string value    = 3; // image URL
}

message UpdateIconResponse {
  Icon icon = 1;
}

message DeleteIconRequest {
  string icon_id = 1;
}

message DeleteIconResponse {}

service IconService {
  rpc ListIcons  (ListIconsRequest)  returns (ListIconsResponse);
  rpc CreateIcon (CreateIconRequest) returns (CreateIconResponse);
  rpc UpdateIcon (UpdateIconRequest) returns (UpdateIconResponse);
  rpc DeleteIcon (DeleteIconRequest) returns (DeleteIconResponse);
}

// ── CategoryService ───────────────────────────────────────────────────────────

message ListCategoriesRequest {
  string          type      = 1; // expense | income | empty = all
  optional string user_id   = 2; // filter by owner user; mutually exclusive with family_id
  optional string family_id = 3; // filter by family; mutually exclusive with user_id
}

message ListCategoriesResponse {
  repeated Category categories = 1;
}

message CreateCategoryRequest {
  string          name      = 1;
  string          icon_id   = 2; // FK → finance_icons.id
  string          color     = 3;
  string          type      = 4;
  optional string family_id = 5; // set to create a family-shared category
}

message CreateCategoryResponse {
  Category category = 1;
}

message UpdateCategoryRequest {
  string          category_id = 1;
  string          name        = 2;
  string          icon_id     = 3; // FK → finance_icons.id
  string          color       = 4;
  optional string family_id   = 5; // family context for ownership validation
}

message UpdateCategoryResponse {
  Category category = 1;
}

message DeleteCategoryRequest {
  string category_id = 1;
}

message DeleteCategoryResponse {}

// ── Admin: System Category Management ─────────────────────────────────────

message ListSystemCategoriesRequest {
  string type = 1; // expense | income | empty = all
}

message ListSystemCategoriesResponse {
  repeated Category categories = 1;
}

message CreateSystemCategoryRequest {
  string name     = 1;
  string icon_id  = 2; // FK → finance_icons.id
  string color    = 3;
  string type     = 4; // expense | income
  string i18n_key = 5; // optional translation key
}

message CreateSystemCategoryResponse {
  Category category = 1;
}

message UpdateSystemCategoryRequest {
  string category_id = 1;
  string name        = 2;
  string icon_id     = 3; // FK → finance_icons.id
  string color       = 4;
  string type        = 5; // expense | income
  string i18n_key    = 6; // optional
}

message UpdateSystemCategoryResponse {
  Category category = 1;
}

message DeleteSystemCategoryRequest {
  string category_id = 1;
}

message DeleteSystemCategoryResponse {}

service CategoryService {
  rpc ListCategories         (ListCategoriesRequest)         returns (ListCategoriesResponse);
  rpc CreateCategory         (CreateCategoryRequest)         returns (CreateCategoryResponse);
  rpc UpdateCategory         (UpdateCategoryRequest)         returns (UpdateCategoryResponse);
  rpc DeleteCategory         (DeleteCategoryRequest)         returns (DeleteCategoryResponse);
  // Admin RPCs — require finance_admin permission at the gateway level
  rpc ListSystemCategories   (ListSystemCategoriesRequest)   returns (ListSystemCategoriesResponse);
  rpc CreateSystemCategory   (CreateSystemCategoryRequest)   returns (CreateSystemCategoryResponse);
  rpc UpdateSystemCategory   (UpdateSystemCategoryRequest)   returns (UpdateSystemCategoryResponse);
  rpc DeleteSystemCategory   (DeleteSystemCategoryRequest)   returns (DeleteSystemCategoryResponse);
}

// ── TransactionService ────────────────────────────────────────────────────────

message ListTransactionsRequest {
  int32  month       = 1; // 0 = all months
  int32  year        = 2; // 0 = all years
  string category_id = 3; // empty = all categories
  string type        = 4; // expense | income | transfer | empty = all
  int32  page        = 5; // 1-based, default 1
  int32  page_size   = 6; // default 20
  // Optional: restrict to a single wallet (must be visible to caller: own or shared family non-private).
  string wallet_id = 7;
  // Optional: "mine" = only wallets owned by caller; "shared" = only other members' non-private family wallets; empty = all visible.
  string wallet_scope = 8;
  // Filter by posting state. UNSPECIFIED (0) = only posted (default / backward compatible).
  TransactionStatus transaction_status = 9;
}

message ListTransactionsResponse {
  repeated Transaction transactions = 1;
  int32                total_count  = 2;
}

message CreateTransactionRequest {
  string wallet_id        = 1;
  string category_id      = 2;
  string amount           = 3;
  string type             = 4;
  string note             = 5;
  string transaction_date = 6; // YYYY-MM-DD
  optional string goal_id          = 7; // optional
  // IANA timezone for classifying "today" vs future and for execute_at (e.g. Asia/Ho_Chi_Minh). Empty = UTC.
  string user_timezone = 10;
  string subtype = 11; // optional; credit_card: purchase, payment, refund, fee, interest
  // Credit-card refund: must reference the original purchase; use with type=income, subtype=refund
  string reference_transaction_id = 12;
  // Optional; duplicate (user, key) returns the existing posted refund (same response body)
  string idempotency_key = 13;
}

message CreateTransactionResponse {
  Transaction transaction = 1;
  // True when a credit-card insert dated in a closed cycle was posted as a current-cycle adjustment.
  bool applied_as_balance_adjustment = 2;
}

message GetRefundStatusRequest {
  string transaction_id = 1; // original purchase row
}

message GetRefundStatusResponse {
  // Absolute purchase amount (decimal string); "0" if not an eligible original
  string original_amount = 1;
  // Sum of posted linked refunds (income + refund + reference = this id)
  string refunded_amount = 2;
  // true when original is a credit-card purchase and refunded_amount < original_amount
  bool can_refund = 3;
  // original_amount - refunded_amount (decimal string)
  string remaining_amount = 4;
}

message UpdateTransactionRequest {
  string transaction_id   = 1;
  string wallet_id        = 2;
  string category_id      = 3;
  string amount           = 4;
  string type             = 5;
  string note             = 6;
  string transaction_date = 7;
  optional string goal_id          = 8; // optional; empty string clears the link
  string user_timezone = 9; // IANA; empty = UTC
  string subtype = 10;
}

message UpdateTransactionResponse {
  Transaction transaction = 1;
  // Present when the balance effect was applied as a new adjustment row (closed statement).
  Transaction adjustment_transaction = 2;
  bool applied_as_adjustment = 3;
}

message DeleteTransactionRequest {
  string transaction_id = 1;
}

message DeleteTransactionResponse {}

message GetTransactionRequest {
  string transaction_id = 1;
}

message GetTransactionResponse {
  Transaction transaction = 1;
}

message GetLatestTransactionRequest {
  string wallet_id = 1; // optional; highest priority
  string family_id = 2; // optional; used when wallet_id is empty
  string user_id   = 3; // optional; used when wallet_id and family_id are both empty
}

message GetLatestTransactionResponse {
  Transaction transaction = 1; // null/empty when no transactions exist
}

message GetFirstTransactionRequest {
  string wallet_id = 1; // optional; highest priority
  string family_id = 2; // optional; used when wallet_id is empty
  string user_id   = 3; // optional; used when wallet_id and family_id are both empty
}

message GetFirstTransactionResponse {
  Transaction transaction = 1; // null/empty when no transactions exist
}

message TransferFundsRequest {
  string from_wallet_id   = 1;
  string to_wallet_id     = 2;
  string amount           = 3; // positive decimal string
  string note             = 4;
  string transaction_date = 5; // YYYY-MM-DD
  string user_timezone    = 6; // IANA; empty = UTC
}

message TransferFundsResponse {
  string transfer_id     = 1;
  Transaction from_entry = 2;
  Transaction to_entry = 3;
}

message ConvertPurchaseToInstallmentRequest {
  string transaction_id = 1;
  int32  months           = 2;
  string user_timezone    = 3; // IANA; empty = UTC
}

message ConvertPurchaseToInstallmentResponse {
  CreditInstallment plan                 = 1;
  Transaction adjustment_transaction     = 2;
}

message ListCreditInstallmentsRequest {
  string wallet_id = 1;
}

message ListCreditInstallmentsResponse {
  repeated CreditInstallment installments = 1;
}

message GetTransactionPermissionsRequest {
  string transaction_id = 1;
}

message GetTransactionPermissionsResponse {
  TransactionPermissions permissions = 1;
}

message RecommendCategoriesRequest {
  string type      = 1; // expense | income
  string timestamp = 2; // RFC3339; empty = server time (UTC)
  string amount    = 3;
}

message CategoryRecommendation {
  string category_id = 1;
  double confidence  = 2; // 0..1 relative to top result
}

message RecommendCategoriesResponse {
  repeated CategoryRecommendation recommendations = 1;
}

message UpdateCreditInstallmentRequest {
  string installment_id = 1;
  string total_amount     = 2;
  int32  months           = 3;
  string user_timezone    = 4; // IANA; empty = UTC
}

message UpdateCreditInstallmentResponse {
  CreditInstallment plan = 1;
}

message DeleteCreditInstallmentRequest {
  string installment_id = 1;
}

message DeleteCreditInstallmentResponse {}

service TransactionService {
  rpc ListTransactions     (ListTransactionsRequest)     returns (ListTransactionsResponse);
  rpc CreateTransaction    (CreateTransactionRequest)    returns (CreateTransactionResponse);
  rpc UpdateTransaction    (UpdateTransactionRequest)    returns (UpdateTransactionResponse);
  rpc DeleteTransaction    (DeleteTransactionRequest)    returns (DeleteTransactionResponse);
  rpc GetTransaction       (GetTransactionRequest)         returns (GetTransactionResponse);
  rpc GetTransactionPermissions (GetTransactionPermissionsRequest) returns (GetTransactionPermissionsResponse);
  rpc GetLatestTransaction (GetLatestTransactionRequest) returns (GetLatestTransactionResponse);
  rpc GetFirstTransaction  (GetFirstTransactionRequest)  returns (GetFirstTransactionResponse);
  rpc TransferFunds        (TransferFundsRequest)         returns (TransferFundsResponse);
  rpc GetRefundStatus      (GetRefundStatusRequest)       returns (GetRefundStatusResponse);
  rpc ConvertPurchaseToInstallment (ConvertPurchaseToInstallmentRequest) returns (ConvertPurchaseToInstallmentResponse);
  rpc ListCreditInstallments       (ListCreditInstallmentsRequest)       returns (ListCreditInstallmentsResponse);
  rpc UpdateCreditInstallment (UpdateCreditInstallmentRequest) returns (UpdateCreditInstallmentResponse);
  rpc DeleteCreditInstallment (DeleteCreditInstallmentRequest) returns (DeleteCreditInstallmentResponse);
  // Real-time category recommendation based on hour, day-of-week, recency, and global usage.
  rpc RecommendCategories (RecommendCategoriesRequest) returns (RecommendCategoriesResponse);
}

// ── Credit card statements ────────────────────────────────────────────────────

message CreditStatement {
  string id                = 1;
  string wallet_id         = 2;
  string cycle_start       = 3; // YYYY-MM-DD
  string cycle_end         = 4;
  string due_date          = 5;
  string total_spent       = 6;
  string total_payment     = 7;
  string previous_balance  = 8;
  string new_balance       = 9;
  string minimum_payment   = 10;
  string remaining_balance = 11;
  bool   is_paid           = 12;
  string paid_at           = 13; // RFC3339 or empty
  string created_at        = 14;
  bool   is_closed         = 15; // immutable snapshot; never recompute totals
}

message ListCreditStatementsRequest {
  string wallet_id = 1;
}

message ListCreditStatementsResponse {
  repeated CreditStatement statements = 1;
}

message MarkStatementPaidRequest {
  string statement_id = 1;
}

message MarkStatementPaidResponse {
  CreditStatement statement = 1;
}

