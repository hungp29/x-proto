syntax = "proto3";

package finance.v1;

option go_package = "github.com/hungp29/x-proto/gen/go/finance/v1;financev1";

// ── Shared domain types ───────────────────────────────────────────────────────

message Wallet {
  string id         = 1;
  string user_id    = 2;
  string name       = 3;
  string type       = 4; // cash | bank | ewallet | credit_card
  string balance    = 5; // formatted decimal string
  string currency   = 6;
  bool   is_default = 7;
  string created_at = 8;
  string updated_at = 9;
  bool   is_private = 10; // hidden from other family members when true
  string icon_id    = 11; // FK → finance_icons.id; empty = no icon
  // credit_card-only fields (empty/zero for other wallet types)
  string          credit_limit        = 12; // formatted decimal; 0 = no limit set
  string          due_date            = 13; // YYYY-MM-DD; empty if not set
  optional int32  billing_cycle_start = 14; // day of month 1–31; unset if not applicable
  optional int32  billing_cycle_end   = 15; // day of month 1–31; unset if not applicable
  string          interest_rate       = 16; // annual percentage rate as decimal string
  Icon            icon_info           = 17; // resolved icon (null when icon_id is empty)
}

// ── Icon ──────────────────────────────────────────────────────────────────────

message Icon {
  string id       = 1;
  string category = 2;
  string value    = 3;
}

enum TransactionStatus {
  TRANSACTION_STATUS_UNSPECIFIED = 0;
  TRANSACTION_STATUS_POSTED = 1;
  TRANSACTION_STATUS_SCHEDULED = 2;
}

message Category {
  string id        = 1;
  string user_id   = 2; // empty = system default or family category
  string name      = 3;
  string icon_id   = 4; // FK → finance_icons.id; empty = no icon
  string color     = 5;
  string type      = 6; // expense | income
  bool   is_system = 7;
  string i18n_key  = 8; // translation key; empty for user-defined categories
  optional string family_id = 9; // set when category is shared across a family
  bool is_family = 10; // true when family_id is set
  bool is_user   = 11; // true when user_id is set and family_id is not
  Icon icon_info = 12; // resolved icon (null when icon_id is empty)
}

message Transaction {
  string id               = 1;
  string user_id          = 2;
  string wallet_id        = 3;
  string category_id      = 4;
  string amount           = 5; // formatted decimal string
  string type             = 6; // expense | income | transfer
  string note             = 7;
  string transaction_date = 8; // YYYY-MM-DD
  string created_at       = 9;
  string updated_at       = 10;
  // Denormalized for convenience
  Category category = 11;
  Wallet   wallet   = 12;
  // Optional link to a savings/debt-payoff goal
  string goal_id = 13;
  TransactionStatus status = 14;
  string execute_at = 15; // RFC3339 nanoseconds, UTC; when the row becomes due
  // Credit / transfer metadata (empty when not applicable)
  string subtype    = 16; // purchase | payment | refund | fee | interest | adjustment
  string transfer_id = 17;
  string transfer_leg = 18; // out | in for paired transfer rows
  // Linked refund: points to the original purchase row (empty for normal rows)
  string reference_transaction_id = 19;
  // Set only when the client supplied an idempotency key on create (empty otherwise)
  string idempotency_key = 20;
  // Populated when the row was closed into an immutable credit statement snapshot.
  optional string statement_id = 21;
  // True when statement_id references a closed credit statement (balance edits become adjustments).
  bool belongs_to_closed_statement = 22;
  // Credit-card trả góp: scheduled/purchase legs reference the plan; empty when not installment-related.
  optional string installment_id = 23;
  optional int32 installment_seq = 24;
  // True when this posted purchase was converted into an installment plan.
  bool is_converted_to_installment = 25;
  // Engine-created rows (installment reversal, installment payments).
  bool is_system_generated = 26;
  // installment_adjustment | installment_payment | empty for user rows
  string system_type = 27;
}

message TransactionPermissions {
  bool can_edit = 1;
  bool can_delete = 2;
  // Empty when mutable. Otherwise: IN_STATEMENT | INSTALLMENT_ADJUSTMENT | SYSTEM_GENERATED
  string reason = 3;
}

message CreditInstallment {
  string id                         = 1;
  string user_id                    = 2;
  string wallet_id                  = 3;
  string original_transaction_id    = 4;
  string total_amount               = 5;
  int32  months                     = 6;
  string monthly_amount             = 7;
  string interest_rate              = 8;
  string fee                        = 9;
  string start_date                 = 10; // YYYY-MM-DD
  string created_at                 = 11;
  int32  scheduled_remaining        = 12;
  int32  posted_legs                = 13;
}

message Budget {
  string id          = 1;
  string user_id     = 2;
  string category_id = 3;
  string amount      = 4; // budget limit
  string spent       = 5; // actual spent this month (computed)
  int32  month       = 6;
  int32  year        = 7;
  Category category  = 8;
}

message Goal {
  string id             = 1;
  string user_id        = 2;
  string name           = 3;
  string type           = 4; // savings | debt_payoff
  string target_amount  = 5;
  string current_amount = 6;
  string deadline       = 7; // YYYY-MM-DD, empty if none
  string note           = 8;
  bool   is_completed   = 9;
  string created_at     = 10;
  string updated_at     = 11;
}

message Family {
  string id         = 1;
  string name       = 2;
  string created_at = 3;
  string updated_at = 4;
  repeated FamilyMember members = 5;
}

message FamilyMember {
  string user_id   = 1;
  string family_id = 2;
  string role      = 3; // owner | member
  string joined_at = 4;
  // Denormalized
  string user_name  = 5;
  string user_email = 6;
}

message CategoryBreakdown {
  string category_id    = 1;
  string category_name  = 2;
  string category_icon  = 3;
  string category_color = 4;
  string amount         = 5;
  double percentage     = 6;
  string i18n_key       = 7;
}

message MonthlySummary {
  int32  month           = 1;
  int32  year            = 2;
  string total_income    = 3;
  string total_expense   = 4;
  string net_balance     = 5;
  string savings_rate    = 6; // percentage string, e.g. "23.5"
  repeated CategoryBreakdown expense_breakdown = 7;
  repeated CategoryBreakdown income_breakdown  = 8;
}

message MonthlyTrendItem {
  int32  month   = 1;
  int32  year    = 2;
  double income  = 3;
  double expense = 4;
  double balance = 5; // income - expense
}

// ── WalletService ─────────────────────────────────────────────────────────────

message ListWalletsRequest {}

message ListWalletsResponse {
  repeated Wallet wallets = 1;
}

message CreateWalletRequest {
  string name       = 1;
  string type       = 2;
  string balance    = 3;
  string currency   = 4;
  bool   is_default = 5;
  bool   is_private = 6;
  string icon_id    = 7; // FK → finance_icons.id
  // credit_card-only fields; ignored for other wallet types
  string          credit_limit        = 8;
  string          due_date            = 9;  // YYYY-MM-DD
  optional int32  billing_cycle_start = 10;
  optional int32  billing_cycle_end   = 11;
  string          interest_rate       = 12;
}

message CreateWalletResponse {
  Wallet wallet = 1;
}

message UpdateWalletRequest {
  string wallet_id  = 1;
  string name       = 2;
  string type       = 3;
  string currency   = 4;
  bool   is_default = 5;
  bool   is_private = 6;
  string icon_id    = 7; // FK → finance_icons.id
  // credit_card-only fields; ignored for other wallet types
  string          credit_limit        = 8;
  string          due_date            = 9;  // YYYY-MM-DD
  optional int32  billing_cycle_start = 10;
  optional int32  billing_cycle_end   = 11;
  string          interest_rate       = 12;
}

message UpdateWalletResponse {
  Wallet wallet = 1;
}

message DeleteWalletRequest {
  string wallet_id = 1;
}

message DeleteWalletResponse {}

service WalletService {
  rpc ListWallets  (ListWalletsRequest)  returns (ListWalletsResponse);
  rpc CreateWallet (CreateWalletRequest) returns (CreateWalletResponse);
  rpc UpdateWallet (UpdateWalletRequest) returns (UpdateWalletResponse);
  rpc DeleteWallet (DeleteWalletRequest) returns (DeleteWalletResponse);
  rpc ListCreditStatements (ListCreditStatementsRequest) returns (ListCreditStatementsResponse);
  rpc MarkStatementPaid    (MarkStatementPaidRequest)    returns (MarkStatementPaidResponse);
}

// ── IconService ───────────────────────────────────────────────────────────────

