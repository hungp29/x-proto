syntax = "proto3";

package finance.v1;

option go_package = "github.com/hungp29/x-proto/gen/go/finance/v1;financev1";

// ── Shared domain types ───────────────────────────────────────────────────────

message Wallet {
  string id         = 1;
  string user_id    = 2;
  string name       = 3;
  string type       = 4; // cash | bank | ewallet | credit_card
  string balance    = 5; // formatted decimal string
  string currency   = 6;
  bool   is_default = 7;
  string created_at = 8;
  string updated_at = 9;
  bool   is_private = 10; // hidden from other family members when true
  string icon_id    = 11; // FK → finance_icons.id; empty = no icon
  // credit_card-only fields (empty/zero for other wallet types)
  string          credit_limit        = 12; // formatted decimal; 0 = no limit set
  string          due_date            = 13; // YYYY-MM-DD; empty if not set
  optional int32  billing_cycle_start = 14; // day of month 1–31; unset if not applicable
  optional int32  billing_cycle_end   = 15; // day of month 1–31; unset if not applicable
  string          interest_rate       = 16; // annual percentage rate as decimal string
  Icon            icon_info           = 17; // resolved icon (null when icon_id is empty)
}

// ── Icon ──────────────────────────────────────────────────────────────────────

message Icon {
  string id       = 1;
  string category = 2;
  string value    = 3;
}

message Category {
  string id        = 1;
  string user_id   = 2; // empty = system default or family category
  string name      = 3;
  string icon_id   = 4; // FK → finance_icons.id; empty = no icon
  string color     = 5;
  string type      = 6; // expense | income
  bool   is_system = 7;
  string i18n_key  = 8; // translation key; empty for user-defined categories
  optional string family_id = 9; // set when category is shared across a family
  bool is_family = 10; // true when family_id is set
  bool is_user   = 11; // true when user_id is set and family_id is not
  Icon icon_info = 12; // resolved icon (null when icon_id is empty)
}

message Transaction {
  string id               = 1;
  string user_id          = 2;
  string wallet_id        = 3;
  string category_id      = 4;
  string amount           = 5; // formatted decimal string
  string type             = 6; // expense | income | transfer
  string note             = 7;
  string transaction_date = 8; // YYYY-MM-DD
  string created_at       = 9;
  string updated_at       = 10;
  // Denormalized for convenience
  Category category = 11;
  Wallet   wallet   = 12;
  // Optional link to a savings/debt-payoff goal
  string goal_id = 13;
}

message Budget {
  string id          = 1;
  string user_id     = 2;
  string category_id = 3;
  string amount      = 4; // budget limit
  string spent       = 5; // actual spent this month (computed)
  int32  month       = 6;
  int32  year        = 7;
  Category category  = 8;
}

message Goal {
  string id             = 1;
  string user_id        = 2;
  string name           = 3;
  string type           = 4; // savings | debt_payoff
  string target_amount  = 5;
  string current_amount = 6;
  string deadline       = 7; // YYYY-MM-DD, empty if none
  string note           = 8;
  bool   is_completed   = 9;
  string created_at     = 10;
  string updated_at     = 11;
}

message Family {
  string id         = 1;
  string name       = 2;
  string created_at = 3;
  string updated_at = 4;
  repeated FamilyMember members = 5;
}

message FamilyMember {
  string user_id   = 1;
  string family_id = 2;
  string role      = 3; // owner | member
  string joined_at = 4;
  // Denormalized
  string user_name  = 5;
  string user_email = 6;
}

message CategoryBreakdown {
  string category_id    = 1;
  string category_name  = 2;
  string category_icon  = 3;
  string category_color = 4;
  string amount         = 5;
  double percentage     = 6;
  string i18n_key       = 7;
}

message MonthlySummary {
  int32  month           = 1;
  int32  year            = 2;
  string total_income    = 3;
  string total_expense   = 4;
  string net_balance     = 5;
  string savings_rate    = 6; // percentage string, e.g. "23.5"
  repeated CategoryBreakdown expense_breakdown = 7;
  repeated CategoryBreakdown income_breakdown  = 8;
}

message MonthlyTrendItem {
  int32  month   = 1;
  int32  year    = 2;
  double income  = 3;
  double expense = 4;
  double balance = 5; // income - expense
}

// ── WalletService ─────────────────────────────────────────────────────────────

message ListWalletsRequest {}

message ListWalletsResponse {
  repeated Wallet wallets = 1;
}

message CreateWalletRequest {
  string name       = 1;
  string type       = 2;
  string balance    = 3;
  string currency   = 4;
  bool   is_default = 5;
  bool   is_private = 6;
  string icon_id    = 7; // FK → finance_icons.id
  // credit_card-only fields; ignored for other wallet types
  string          credit_limit        = 8;
  string          due_date            = 9;  // YYYY-MM-DD
  optional int32  billing_cycle_start = 10;
  optional int32  billing_cycle_end   = 11;
  string          interest_rate       = 12;
}

message CreateWalletResponse {
  Wallet wallet = 1;
}

message UpdateWalletRequest {
  string wallet_id  = 1;
  string name       = 2;
  string type       = 3;
  string currency   = 4;
  bool   is_default = 5;
  bool   is_private = 6;
  string icon_id    = 7; // FK → finance_icons.id
  // credit_card-only fields; ignored for other wallet types
  string          credit_limit        = 8;
  string          due_date            = 9;  // YYYY-MM-DD
  optional int32  billing_cycle_start = 10;
  optional int32  billing_cycle_end   = 11;
  string          interest_rate       = 12;
}

message UpdateWalletResponse {
  Wallet wallet = 1;
}

message DeleteWalletRequest {
  string wallet_id = 1;
}

message DeleteWalletResponse {}

service WalletService {
  rpc ListWallets  (ListWalletsRequest)  returns (ListWalletsResponse);
  rpc CreateWallet (CreateWalletRequest) returns (CreateWalletResponse);
  rpc UpdateWallet (UpdateWalletRequest) returns (UpdateWalletResponse);
  rpc DeleteWallet (DeleteWalletRequest) returns (DeleteWalletResponse);
}

// ── IconService ───────────────────────────────────────────────────────────────

message ListIconsRequest {
  string category = 1; // optional filter by category
}

message ListIconsResponse {
  repeated Icon icons = 1;
}

message CreateIconRequest {
  string category = 1; // e.g. wallet | category | goal
  string value    = 2; // image URL
}

message CreateIconResponse {
  Icon icon = 1;
}

message UpdateIconRequest {
  string icon_id  = 1;
  string category = 2;
  string value    = 3; // image URL
}

message UpdateIconResponse {
  Icon icon = 1;
}

message DeleteIconRequest {
  string icon_id = 1;
}

message DeleteIconResponse {}

service IconService {
  rpc ListIcons  (ListIconsRequest)  returns (ListIconsResponse);
  rpc CreateIcon (CreateIconRequest) returns (CreateIconResponse);
  rpc UpdateIcon (UpdateIconRequest) returns (UpdateIconResponse);
  rpc DeleteIcon (DeleteIconRequest) returns (DeleteIconResponse);
}

// ── CategoryService ───────────────────────────────────────────────────────────

message ListCategoriesRequest {
  string          type      = 1; // expense | income | empty = all
  optional string user_id   = 2; // filter by owner user; mutually exclusive with family_id
  optional string family_id = 3; // filter by family; mutually exclusive with user_id
}

message ListCategoriesResponse {
  repeated Category categories = 1;
}

message CreateCategoryRequest {
  string          name      = 1;
  string          icon_id   = 2; // FK → finance_icons.id
  string          color     = 3;
  string          type      = 4;
  optional string family_id = 5; // set to create a family-shared category
}

message CreateCategoryResponse {
  Category category = 1;
}

message UpdateCategoryRequest {
  string          category_id = 1;
  string          name        = 2;
  string          icon_id     = 3; // FK → finance_icons.id
  string          color       = 4;
  optional string family_id   = 5; // family context for ownership validation
}

message UpdateCategoryResponse {
  Category category = 1;
}

message DeleteCategoryRequest {
  string category_id = 1;
}

message DeleteCategoryResponse {}

// ── Admin: System Category Management ─────────────────────────────────────

message ListSystemCategoriesRequest {
  string type = 1; // expense | income | empty = all
}

message ListSystemCategoriesResponse {
  repeated Category categories = 1;
}

message CreateSystemCategoryRequest {
  string name     = 1;
  string icon_id  = 2; // FK → finance_icons.id
  string color    = 3;
  string type     = 4; // expense | income
  string i18n_key = 5; // optional translation key
}

message CreateSystemCategoryResponse {
  Category category = 1;
}

message UpdateSystemCategoryRequest {
  string category_id = 1;
  string name        = 2;
  string icon_id     = 3; // FK → finance_icons.id
  string color       = 4;
  string type        = 5; // expense | income
  string i18n_key    = 6; // optional
}

message UpdateSystemCategoryResponse {
  Category category = 1;
}

message DeleteSystemCategoryRequest {
  string category_id = 1;
}

message DeleteSystemCategoryResponse {}

service CategoryService {
  rpc ListCategories         (ListCategoriesRequest)         returns (ListCategoriesResponse);
  rpc CreateCategory         (CreateCategoryRequest)         returns (CreateCategoryResponse);
  rpc UpdateCategory         (UpdateCategoryRequest)         returns (UpdateCategoryResponse);
  rpc DeleteCategory         (DeleteCategoryRequest)         returns (DeleteCategoryResponse);
  // Admin RPCs — require finance_admin permission at the gateway level
  rpc ListSystemCategories   (ListSystemCategoriesRequest)   returns (ListSystemCategoriesResponse);
  rpc CreateSystemCategory   (CreateSystemCategoryRequest)   returns (CreateSystemCategoryResponse);
  rpc UpdateSystemCategory   (UpdateSystemCategoryRequest)   returns (UpdateSystemCategoryResponse);
  rpc DeleteSystemCategory   (DeleteSystemCategoryRequest)   returns (DeleteSystemCategoryResponse);
}

// ── TransactionService ────────────────────────────────────────────────────────

message ListTransactionsRequest {
  int32  month       = 1; // 0 = all months
  int32  year        = 2; // 0 = all years
  string category_id = 3; // empty = all categories
  string type        = 4; // expense | income | transfer | empty = all
  int32  page        = 5; // 1-based, default 1
  int32  page_size   = 6; // default 20
  // Optional: restrict to a single wallet (must be visible to caller: own or shared family non-private).
  string wallet_id = 7;
  // Optional: "mine" = only wallets owned by caller; "shared" = only other members' non-private family wallets; empty = all visible.
  string wallet_scope = 8;
}

message ListTransactionsResponse {
  repeated Transaction transactions = 1;
  int32                total_count  = 2;
}

message CreateTransactionRequest {
  string wallet_id        = 1;
  string category_id      = 2;
  string amount           = 3;
  string type             = 4;
  string note             = 5;
  string transaction_date = 6; // YYYY-MM-DD
  optional string goal_id          = 7; // optional
}

message CreateTransactionResponse {
  Transaction transaction = 1;
}

message UpdateTransactionRequest {
  string transaction_id   = 1;
  string wallet_id        = 2;
  string category_id      = 3;
  string amount           = 4;
  string type             = 5;
  string note             = 6;
  string transaction_date = 7;
  optional string goal_id          = 8; // optional; empty string clears the link
}

message UpdateTransactionResponse {
  Transaction transaction = 1;
}

message DeleteTransactionRequest {
  string transaction_id = 1;
}

message DeleteTransactionResponse {}

message GetLatestTransactionRequest {
  string wallet_id = 1; // optional; highest priority
  string family_id = 2; // optional; used when wallet_id is empty
  string user_id   = 3; // optional; used when wallet_id and family_id are both empty
}

message GetLatestTransactionResponse {
  Transaction transaction = 1; // null/empty when no transactions exist
}

message GetFirstTransactionRequest {
  string wallet_id = 1; // optional; highest priority
  string family_id = 2; // optional; used when wallet_id is empty
  string user_id   = 3; // optional; used when wallet_id and family_id are both empty
}

message GetFirstTransactionResponse {
  Transaction transaction = 1; // null/empty when no transactions exist
}

service TransactionService {
  rpc ListTransactions     (ListTransactionsRequest)     returns (ListTransactionsResponse);
  rpc CreateTransaction    (CreateTransactionRequest)    returns (CreateTransactionResponse);
  rpc UpdateTransaction    (UpdateTransactionRequest)    returns (UpdateTransactionResponse);
  rpc DeleteTransaction    (DeleteTransactionRequest)    returns (DeleteTransactionResponse);
  rpc GetLatestTransaction (GetLatestTransactionRequest) returns (GetLatestTransactionResponse);
  rpc GetFirstTransaction  (GetFirstTransactionRequest)  returns (GetFirstTransactionResponse);
}

// ── BudgetService ─────────────────────────────────────────────────────────────

message SetBudgetRequest {
  string category_id = 1;
  string amount      = 2;
  int32  month       = 3;
  int32  year        = 4;
}

message SetBudgetResponse {
  Budget budget = 1;
}

message DeleteBudgetRequest {
  string budget_id = 1;
}

message DeleteBudgetResponse {}

message ListBudgetsRequest {
  int32 month = 1;
  int32 year  = 2;
}

message ListBudgetsResponse {
  repeated Budget budgets = 1;
}

service BudgetService {
  rpc SetBudget    (SetBudgetRequest)    returns (SetBudgetResponse);
  rpc DeleteBudget (DeleteBudgetRequest) returns (DeleteBudgetResponse);
  rpc ListBudgets  (ListBudgetsRequest)  returns (ListBudgetsResponse);
}

// ── GoalService ───────────────────────────────────────────────────────────────

message ListGoalsRequest {}

message ListGoalsResponse {
  repeated Goal goals = 1;
}

message CreateGoalRequest {
  string name           = 1;
  string type           = 2;
  string target_amount  = 3;
  string current_amount = 4;
  string deadline       = 5;
  string note           = 6;
}

message CreateGoalResponse {
  Goal goal = 1;
}

message UpdateGoalRequest {
  string goal_id        = 1;
  string name           = 2;
  string target_amount  = 3;
  string current_amount = 4;
  string deadline       = 5;
  string note           = 6;
  bool   is_completed   = 7;
}

message UpdateGoalResponse {
  Goal goal = 1;
}

message DeleteGoalRequest {
  string goal_id = 1;
}

message DeleteGoalResponse {}

service GoalService {
  rpc ListGoals  (ListGoalsRequest)  returns (ListGoalsResponse);
  rpc CreateGoal (CreateGoalRequest) returns (CreateGoalResponse);
  rpc UpdateGoal (UpdateGoalRequest) returns (UpdateGoalResponse);
  rpc DeleteGoal (DeleteGoalRequest) returns (DeleteGoalResponse);
}

// ── AnalyticsService ──────────────────────────────────────────────────────────

message GetMonthlySummaryRequest {
  int32 month = 1;
  int32 year  = 2;
}

message GetMonthlySummaryResponse {
  MonthlySummary summary = 1;
}

message GetMonthlyTrendRequest {
  string wallet_id  = 1; // optional; highest priority
  string family_id  = 2; // optional; used when wallet_id is empty
  string user_id    = 3; // optional; used when wallet_id and family_id are both empty

  int32  from_year  = 4;
  int32  from_month = 5;
  int32  to_year    = 6;
  int32  to_month   = 7;
}

message GetMonthlyTrendResponse {
  repeated MonthlyTrendItem items = 1;
}

service AnalyticsService {
  rpc GetMonthlySummary (GetMonthlySummaryRequest) returns (GetMonthlySummaryResponse);
  rpc GetMonthlyTrend   (GetMonthlyTrendRequest)   returns (GetMonthlyTrendResponse);
}

// ── FamilyService ─────────────────────────────────────────────────────────────

message CreateFamilyRequest {
  string name = 1;
}

message CreateFamilyResponse {
  Family family = 1;
}

message GetFamilyRequest {}   // returns the calling user's family

message GetFamilyResponse {
  Family family = 1; // empty id when user has no family
}

message AddFamilyMemberRequest {
  string user_email = 1; // invite by email
}

message AddFamilyMemberResponse {
  FamilyMember member = 1;
}

message RemoveFamilyMemberRequest {
  string user_id = 1;
}

message RemoveFamilyMemberResponse {}

message LeaveFamilyRequest {}

message LeaveFamilyResponse {}

service FamilyService {
  rpc CreateFamily       (CreateFamilyRequest)       returns (CreateFamilyResponse);
  rpc GetFamily          (GetFamilyRequest)           returns (GetFamilyResponse);
  rpc AddFamilyMember    (AddFamilyMemberRequest)     returns (AddFamilyMemberResponse);
  rpc RemoveFamilyMember (RemoveFamilyMemberRequest)  returns (RemoveFamilyMemberResponse);
  rpc LeaveFamily        (LeaveFamilyRequest)         returns (LeaveFamilyResponse);
}
