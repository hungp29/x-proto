  rpc DeleteGoal             (DeleteGoalRequest)             returns (DeleteGoalResponse);
  rpc AllocateToGoal         (AllocateToGoalRequest)         returns (AllocateToGoalResponse);
  rpc GetGoalAllocations     (GetGoalAllocationsRequest)     returns (GetGoalAllocationsResponse);
