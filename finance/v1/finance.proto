  rpc DeleteBudget (DeleteBudgetRequest) returns (DeleteBudgetResponse);
  rpc ListBudgets  (ListBudgetsRequest)  returns (ListBudgetsResponse);
}

// ── GoalService ───────────────────────────────────────────────────────────────

message GoalAllocation {
  string id         = 1;
  string goal_id    = 2;
  string wallet_id  = 3;
  string amount     = 4;
  string created_at = 5;
}

message ListGoalsRequest {}

message ListGoalsResponse {
  repeated Goal goals = 1;
}

message CreateGoalRequest {
  string name          = 1;
  string type          = 2;
  string target_amount = 3;
  string deadline      = 4;
  string note          = 5;
}

message CreateGoalResponse {
  Goal goal = 1;
}

message UpdateGoalRequest {
  string goal_id       = 1;
  string name          = 2;
  string target_amount = 3;
  string deadline      = 4;
  string note          = 5;
  bool   is_completed  = 6;
}

message UpdateGoalResponse {
  Goal goal = 1;
}

message DeleteGoalRequest {
  string goal_id = 1;
}

message DeleteGoalResponse {}

message AllocateToGoalRequest {
  string goal_id   = 1;
  string wallet_id = 2;
  string amount    = 3;
}

message AllocateToGoalResponse {
