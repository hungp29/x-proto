  rpc GetDebtPayments        (GetDebtPaymentsRequest)        returns (GetDebtPaymentsResponse);
  rpc DeleteDebtPayment      (DeleteDebtPaymentRequest)      returns (DeleteDebtPaymentResponse);
}

// ── AnalyticsService ──────────────────────────────────────────────────────────

message GetMonthlySummaryRequest {
  int32 month = 1;
  int32 year  = 2;
}

message GetMonthlySummaryResponse {
  MonthlySummary summary = 1;
}

message GetMonthlyTrendRequest {
  string wallet_id  = 1; // optional; highest priority
  string family_id  = 2; // optional; used when wallet_id is empty
